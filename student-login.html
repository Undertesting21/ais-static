<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Amsic Integrated School</title>
    <link rel="icon" type="image/x-icon" href="assets/images/amsic_logo.png">
</head>
<body>
    <div
        style="background-image: url('assets/images/ais_cover.png')"
        class="relative min-h-screen bg-center bg-cover bg-no-repeat">

        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/50 to-black/80"></div>
        
        <!-- header -->
        <div x-data="{ open: false, showAbout: false }"
            class="fixed top-0 left-0 w-full z-50 bg-gradient-to-r from-[#a4a726]/90 to-[#111111]/90 backdrop-blur-md">

            <div class="flex items-center justify-between px-6 md:px-16 py-3">

                <!-- LEFT: Logo -->
                <a href="index.html" class="flex items-center gap-3 cursor-pointer">
                    <img src="assets/images/amsic_logo.png"
                        class="h-12 md:h-16" alt="">

                    <img src="assets/images/achieve_innovate_serve.png"
                        class="h-10 hidden lg:block" alt="">
                </a>

                <!-- DESKTOP MENU -->
                <div class="hidden md:flex items-center gap-8">

                    <!-- Home -->
                    <a href="index.html" 
                        class="relative font-medium tracking-wide transition duration-300
                        text-[#e6e9c3] font-semibold drop-shadow-[0_0_6px_rgba(230,233,195,0.6)]">
                        Home

                        <span class="absolute left-0 -bottom-1 h-[2px] bg-[#e6e9c3] w-full"></span>
                    </a>

                    <!-- About Dropdown -->
                    <div class="relative">
                        <button @click="showAbout = !showAbout" 
                            class="relative font-medium tracking-wide transition duration-300
                            text-white hover:text-[#e6e9c3]">
                            About

                            <span class="absolute left-0 -bottom-1 h-[2px] bg-[#e6e9c3] w-0"></span>
                        </button>

                        <div x-show="showAbout" x-cloak @click.outside="showAbout = false"
                            class="absolute right-0 mt-3 w-60 
                            bg-[#5f6320] 
                            backdrop-blur-md rounded-xl shadow-2xl overflow-hidden">

                            <a href="hymn.html" 
                                class="px-4 py-3 text-white hover:bg-[#4c4e04] transition flex items-center gap-2">
                                <i class="fa-solid fa-music text-[#e6e9c3]"></i> Hymn
                            </a>

                            <a href="deped-ac-march.html" 
                                class="px-4 py-3 text-white hover:bg-[#4c4e04] transition flex items-center gap-2">
                                <i class="fa-solid fa-landmark text-[#e6e9c3]"></i> DepEd AC – March
                            </a>

                            <a href="org-structure.html" 
                                class="px-4 py-3 text-white hover:bg-[#4c4e04] transition flex items-center gap-2">
                                <i class="fa-solid fa-sitemap text-[#e6e9c3]"></i> Organizational Structure
                            </a>

                            <a href="brief-history.html" 
                                class="px-4 py-3 text-white hover:bg-[#4c4e04] transition flex items-center gap-2">
                                <i class="fa-solid fa-book text-[#e6e9c3]"></i> Brief History
                            </a>
                        </div>
                    </div>

                    <!-- Admission -->
                    <a href="admission.html" 
                        class="relative font-medium tracking-wide transition duration-300 text-white hover:text-[#e6e9c3]">
                        Admission

                        <span class="absolute left-0 -bottom-1 h-[2px] bg-[#e6e9c3] w-0"></span>
                    </a>

                    <!-- News -->
                    <a href="list-news.html" 
                        class="relative font-medium tracking-wide transition duration-300 text-white hover:text-[#e6e9c3]">
                        News

                        <span class="absolute left-0 -bottom-1 h-[2px] bg-[#e6e9c3] w-0"></span>
                    </a>

                    <!-- Contact Us -->
                    <a href="contact-us.html" 
                        class="relative font-medium tracking-wide transition duration-300 text-white hover:text-[#e6e9c3]">
                        Contact Us

                        <span class="absolute left-0 -bottom-1 h-[2px] bg-[#e6e9c3] w-0"></span>
                    </a>

                    <!-- Login -->
                    <a href="login.html"
                        class="relative inline-flex items-center justify-center px-5 py-2 rounded-full 
                            font-semibold text-white overflow-hidden group transition-all duration-300">

                        <!-- animated gradient -->
                        <span class="absolute inset-0 bg-[linear-gradient(270deg,#8a8d4c,#b4b76a,#6f723a,#8a8d4c)] 
                            bg-[length:400%_400%] animate-gradient"></span>

                        <!-- glow -->
                        <span class="absolute inset-0 blur-md opacity-60 
                            bg-[linear-gradient(270deg,#8a8d4c,#b4b76a,#6f723a,#8a8d4c)]
                            group-hover:opacity-100 transition"></span>

                        <!-- shine -->
                        <span class="absolute top-0 -left-full w-1/2 h-full bg-white/30 skew-x-[-20deg]
                            group-hover:left-[150%] transition-all duration-700"></span>

                        <!-- text -->
                        <span class="relative z-10
                            group-hover:scale-110 transition">
                            Login
                        </span>
                    </a>

                </div>

                <!-- MOBILE BUTTON -->
                <button @click="open = !open" class="md:hidden text-white text-2xl">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
            

            <!-- MOBILE MENU -->
            <div x-show="open" x-cloak x-transition
                class="md:hidden 
                    bg-gradient-to-b from-[#6f723a] via-[#4c4e04] to-[#2f310f]
                    text-white px-5 py-6 flex flex-col gap-3 shadow-2xl">

                <!-- Main Links -->
                <a href="index.html"
                class="px-4 py-3 rounded-xl hover:bg-white/10 transition font-medium">
                    Home
                </a>

                <!-- About Section -->
                <div class="mt-2">
                    <p class="px-4 text-xs uppercase tracking-[0.2em] text-[#dfe3a3] mb-2">
                        About
                    </p>

                    <div class="flex flex-col gap-2">
                        <a href="hymn.html"
                        class="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
                            Hymn
                        </a>

                        <a href="deped-ac-march.html"
                        class="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
                            DepEd AC – March
                        </a>

                        <a href="org-structure.html"
                        class="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
                            Organizational Structure
                        </a>

                        <a href="brief-history.html"
                        class="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
                            Brief History
                        </a>
                    </div>
                </div>

                <!-- Other Links -->
                <a href="admission.html"
                class="px-4 py-3 rounded-xl hover:bg-white/10 transition font-medium mt-2">
                    Admission
                </a>

                <a href="contact-us.html"
                class="px-4 py-3 rounded-xl hover:bg-white/10 transition font-medium">
                    Contact Us
                </a>

                <!-- Login -->
                <a href="login.html"
                class="mt-4 bg-[#dfe3a3] text-[#4c4e04] px-4 py-3 rounded-2xl text-center font-bold shadow-lg hover:scale-[1.02] transition">
                    Login
                </a>
            </div>

        </div>


        <div class="relative flex items-center justify-center md:justify-end min-h-screen px-0 md:px-20">

            <form wire:submit="login" 
                class="login-form relative z-20 w-full sm:w-[90%] max-w-md 
                    backdrop-blur-xl bg-white/80 border border-white/40
                    rounded-3xl shadow-2xl px-8 py-10 flex flex-col gap-6 translate-y-6 translate-x-0 md:translate-x-[-60px]">

                <p class="text-2xl font-semibold text-center text-[#4c4e04] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-graduate"></i> 
                    Student Login
                </p>

                <div class="flex flex-col gap-1">
                    <input type="number" wire:model="LRN" placeholder="LRN..."
                        class="border border-gray-300 bg-white/90 p-3 rounded-lg outline-none 
                            focus:ring-2 focus:ring-[#94961f] focus:border-[#94961f]
                            transition">

                </div>

                <div
                    x-data="{ showPass: false }" 
                    class="flex flex-col gap-1">
                    
                    <div class="flex items-center border border-gray-300 bg-white/90 rounded-lg
                            focus-within:ring-2 focus-within:ring-[#94961f] 
                            focus-within:border-[#94961f]
                            transition">

                        <input type="password" 
                            x-bind:type="showPass ? 'text' : 'password'" 
                            wire:model="password" 
                            placeholder="Password..."
                            class="p-3 outline-none grow bg-transparent">

                        <button type="button" @click="showPass = !showPass" class="p-3">
                            <i class="fa-solid text-gray-700" x-bind:class="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>

                    </div>

                </div>

                <div class="flex items-center justify-between text-sm">

                    <a wire:navigate href="" 
                        class="text-gray-600 hover:text-[#4c4e04] transition cursor-not-allowed">
                        Forgot Password?
                    </a>

                    <button
                    disabled
                        wire:loading.attr="disabled"
                        wire:target="login"
                        class="flex items-center justify-center gap-2 
                            bg-gradient-to-r from-[#94961f] to-[#4c4e04]
                            text-white w-28 py-2 rounded-lg shadow-md
                            hover:scale-105 hover:shadow-lg 
                            transition-all duration-300 cursor-not-allowed">

                       Log In

                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <hr class="flex-1 border-gray-300">
                    <p class="text-gray-500 text-sm">OR</p>
                    <hr class="flex-1 border-gray-300">
                </div>

                <a wire:navigate href="login.html" 
                    class="flex items-center justify-center gap-2 text-sm 
                        bg-white border border-gray-300 py-2 rounded-lg
                        hover:bg-[#94961f] hover:text-white transition text-gray-700">

                    <i class="fa-solid fa-user-tie"></i>
                    Admin Login
                </a>

            </form>

        </div>


        <div class="absolute left-0 bottom-5 w-full flex items-center justify-center md:justify-end px-20">

            <p class="text-gray-300">
                © 2026 All Rights Reserved.
            </p>

        </div>

    </div>
</body>
</html>
